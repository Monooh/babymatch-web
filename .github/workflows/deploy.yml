name: Deploy to Cloudflare

# Every push to main rebuilds the static site and publishes the seven Workers behind babymatch.app.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.hallmark/**'
      - '.gitignore'
  workflow_dispatch:

# A newer push replaces a deploy that is still running.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set as a repository secret. Nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Build the site (names data, static export, Cloudflare packaging)
        if: steps.creds.outputs.ready == 'true'
        run: npm run build

      - name: Deploy the Workers
        if: steps.creds.outputs.ready == 'true'
        run: npm run deploy

      - name: Check the live site
        if: steps.creds.outputs.ready == 'true'
        run: |
          for path in /es /en/names/olivia /fr/prenoms/emma /de/vornamen/emma /it/nomi/sofia /pt/nomes/helena /es/app /robots.txt; do
            code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "https://babymatch.app$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::https://babymatch.app$path answered $code"; exit 1; }
          done
